name: AI Pet Influencer Agency

on:
  schedule:
    # 08:00 UTC: Daily 3-Beat Video Generation & GitHub Mobile Draft Issue
    - cron: '0 8 * * *'
    # 20:00 UTC Sundays: 7-Day Telemetry, Phase Promotion & Strategy Update
    - cron: '0 20 * * 0'
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode'
        required: true
        default: 'generate'
        type: choice
        options:
          - init_sheets
          - generate
          - evaluate_weekly

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

# Prevents race conditions if you tap 'approve' on mobile while the 08:00 cron is running
concurrency:
  group: agency-git-state-lock
  cancel-in-progress: false

jobs:
  agency-pipeline:
    runs-on: ubuntu-latest
    # Security Guard: Only executes Issue/Comment actions triggered by the repo owner
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.actor == github.repository_owner
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Laya 421M ONNX Checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: laya-onnx-checkpoint-v1

      - name: Install FFmpeg, Subtitle Fonts & Python Packages
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Route Event to Agency Orchestrator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOCIAL_CREDENTIALS_JSON: ${{ secrets.SOCIAL_CREDENTIALS_JSON }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ github.event.inputs.mode }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABEL_NAME: ${{ github.event.label.name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [ "$EVENT_NAME" == "issues" ]; then
            python agency_runner.py --mode handle_issue_event --issue "$ISSUE_NUMBER" --label "$LABEL_NAME"
          elif [ "$EVENT_NAME" == "issue_comment" ]; then
            python agency_runner.py --mode handle_comment_event --issue "$ISSUE_NUMBER"
          elif [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            python agency_runner.py --mode "$DISPATCH_MODE"
          elif [ "$SCHEDULE_CRON" == "0 20 * * 0" ]; then
            python agency_runner.py --mode evaluate_weekly
          else
            python agency_runner.py --mode generate
          fi

      - name: Commit Updated State, Sheets & Storefront to Git
        run: |
          git config user.name "Pet Agency Bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ docs/ assets/
          if ! git diff --staged --quiet; then
            git commit -m "chore(agency): automated state & storefront sync [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi