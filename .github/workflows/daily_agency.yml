name: Autonomous Pet Influencer Agency

on:
  schedule:
    # 08:00 UTC: Daily generation run
    - cron: '0 8 * * *'
    # 22:00 UTC on Sunday: Weekly review
    - cron: '0 22 * * 0'
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'generate'
        type: choice
        options:
          - generate
          - init_sheets
          - evaluate_weekly
          - rebuild_docs

concurrency:
  group: agency-state-lock
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run-agency:
    if: github.event_name != 'issue_comment' && github.event_name != 'issues' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap docs folder for GitHub Pages
        run: |
          mkdir -p docs state
          touch docs/.nojekyll
          if [ ! -f docs/index.html ]; then
            echo "<!DOCTYPE html><html><body><h1>Pet Agency Initializing...</h1></body></html>" > docs/index.html
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Laya ONNX Model Checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: laya-onnx-v1

      - name: Install FFmpeg, Fonts and Python Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Run Agency Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOCIAL_CREDENTIALS_JSON: ${{ secrets.SOCIAL_CREDENTIALS_JSON }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABEL_NAME: ${{ github.event.label.name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ github.event.inputs.mode }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python agency_runner.py

      - name: Commit State and Docs Updates
        run: |
          git config user.name "Pet Agency Bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add -f state/ docs/ docs/.nojekyll
          git diff --staged --quiet || git commit -m "chore: update agency state and docs"
          git push origin main